name: Compilar APK SENSI BLEXCT

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 8512546

    - name: Aceptar licencias del SDK
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Dar permisos a Gradle Wrapper (si existe)
      run: chmod +x gradlew || true

    - name: Compilar APK con Gradle
      run: ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

    - name: Subir el APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: SENSI-BLEXCT-APK
        path: app/build/outputs/apk/debug/app-debug.apk
