name: Compilar APK SENSI BLEXCT

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v2

    - name: Dar permisos de ejecución a Gradle
      run: chmod +x gradlew || true

    - name: Compilar APK (Build Debug)
      run: ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

    - name: Subir el APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: SENSI-BLEXCT-APK
        path: app/build/outputs/apk/debug/app-debug.apk
